[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "graphs_tstrong"
version = "0.1.0"
description = "A library implementing Dijkstra's algorithm and other graph algorithms"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "Trevor", email = "tstrong5@msudenver.edu" }
]

[tool.setuptools.packages.find]
where = ["src"]